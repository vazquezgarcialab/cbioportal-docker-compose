services:
  nginx:
    image: nginx:1.27
    container_name: cbioportal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/cbioportal.conf:ro
      - /etc/ssl/cbioportal:/etc/ssl/cbioportal:ro
    depends_on:
      - cbioportal
    networks:
      - cbio-net

  cbioportal:
    restart: unless-stopped
    image: ${DOCKER_IMAGE_CBIOPORTAL}
    container_name: cbioportal-container
    env_file:
      - .env
    environment:
      SERVER_PORT: ${CBIOPORTAL_SERVER_PORT}
    entrypoint: [ "/cbioportal/entrypoint.sh" ]
    volumes:
      - ./study:/study/
      - ./entrypoint.sh:/cbioportal/entrypoint.sh
      - ${APPLICATION_PROPERTIES_PATH:-./config/application.properties}:/cbioportal-webapp/application.properties:ro
      - ./config/saml-signing.crt:/cbioportal-webapp/saml-signing.crt:ro
      - ./config/saml-signing.key:/cbioportal-webapp/saml-signing.key:ro
      - ./data/clickhouse.sql:/cbioportal/clickhouse.sql:ro
    depends_on:
      cbioportal-database:
        condition: service_healthy
      cbioportal-session:
        condition: service_started
    networks:
     - cbio-net
    command: /bin/sh -c "java -Xms2g -Xmx4g -cp '/cbioportal-webapp:/cbioportal-webapp/lib/*' org.cbioportal.PortalApplication --spring.config.location=file:/cbioportal-webapp/application.properties --authenticate=saml --session.service.url=http://cbioportal-session:5001/api/sessions/my_portal/ --clickhouse_mode=true --spring.profiles.active=clickhouse"

  cbioportal-database:
    restart: unless-stopped
    image: ${DOCKER_IMAGE_CLICKHOUSE}
    container_name: cbioportal-database-container
    env_file:
      - .env
    volumes:
      - ./data/schema.sql:/data/schema.sql:ro
      - ./data/load_schema.sh:/docker-entrypoint-initdb.d/001_load_schema.sh:ro
      - ./data/seed.sql.gz:/data/seed.sql.gz:ro
      - ./data/load_seed.sh:/docker-entrypoint-initdb.d/002_load_seed.sh:ro
      - ./data/clickhouse.sql:/data/clickhouse.sql:ro
      - ./data/load_derived_tables.sh:/docker-entrypoint-initdb.d/003_load_derived_tables.sh:ro
      - ${CLICKHOUSE_SETTINGS_PATH:-./data/clickhouse_user_settings.xml}:/etc/clickhouse-server/users.d/cbio_user.xml:ro
      - ./data/clickhouse_backups.xml:/etc/clickhouse-server/config.d/clickhouse_backups.xml:ro
      - cbioportal_clickhouse_data:/var/lib/clickhouse
      - cbioportal_backups:/backups
    networks:
      - cbio-net
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$$CLICKHOUSE_USER --password=$$CLICKHOUSE_PASSWORD --query=\"SELECT COUNT(*) FROM $$CLICKHOUSE_DB.type_of_cancer\" 2>/dev/null | grep -q '^[1-9]'"]
      interval: 10s
      timeout: 3s
      retries: 300
      start_period: 5m

  cbioportal-session:
    restart: unless-stopped
    image: ${DOCKER_IMAGE_SESSION_SERVICE}
    container_name: cbioportal-session-container
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SESSION_SERVICE_SERVER_PORT}
      JAVA_OPTS: ${SESSION_SERVICE_JAVA_OPTS}
    depends_on:
      - cbioportal-session-database
    networks:
      - cbio-net

  cbioportal-session-database:
    restart: unless-stopped
    image: mongo:4.2
    container_name: cbioportal-session-database-container
    env_file:
      - .env
    volumes:
      - cbioportal_mongo_data:/data/db
    networks:
      - cbio-net

networks:
  cbio-net:

volumes:
  cbioportal_clickhouse_data:
  cbioportal_mongo_data:
  cbioportal_backups:
